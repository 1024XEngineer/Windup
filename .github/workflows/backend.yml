name: Backend CI

on:
  push:
  pull_request:

# 同一 ref 新 run 取消旧的,省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 开源项目最小权限
permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # uv workspace 在 backend/,不是 repo 根
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv 自 v8.0.0 起停止发布 floating major tag(@v7/@v8),
        # 出于安全只发布 immutable tag,故用具体版本号
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen        # 用提交的 uv.lock 锁定版本,不偷偷升级

      - name: Ruff
        run: uv run ruff check .

      - name: Import-linter (分层契约)
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest -q --cov=packages --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // 从 coverage.xml 解析覆盖率
            let coverageData;
            try {
              const xml = fs.readFileSync('backend/coverage.xml', 'utf8');
              const lineRate = xml.match(/line-rate="([\d.]+)"/)?.[1] || '0';
              const branchRate = xml.match(/branch-rate="([\d.]+)"/)?.[1] || '0';
              coverageData = {
                line: (parseFloat(lineRate) * 100).toFixed(2),
                branch: (parseFloat(branchRate) * 100).toFixed(2),
              };
            } catch (e) {
              core.setFailed(`Failed to parse coverage: ${e.message}`);
              return;
            }

            const body = `## 📊 Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Line Coverage | ${coverageData.line}% |
            | Branch Coverage | ${coverageData.branch}% |

            > 📁 HTML report available in [Artifacts](../actions/runs/${{ github.run_id }})
            >
            > Refs: #167`;

            // 查找并更新已有评论,避免重复
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('## 📊 Coverage Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
