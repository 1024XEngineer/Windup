name: Version

# 版本的完整生命周期在这一个文件里:检查 VERSION 变更 → 自动 tag 与 Release → 部署。
#
# 两个 job 而不是一个,因为两件事的触发时机不同:
#   gate    在 PR 上跑。VERSION 非法或回退要在合并前就红 —— 合进 main 之后才炸的话,
#           坏的是一次已经在 main 上的提交,而部署只认 Release。
#   release 等 Backend CI 绿之后跑。直接挂 push 会在测试未过时就发版(#334 第四节)。
on:
  pull_request:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  # ── 1. 检查 VERSION 变更 ──────────────────────────────────────────────────
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 要比对已发布的 tag,浅 clone 拿不到

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 闸口自测
        # 发版逻辑写错的代价不是一次红 CI,是一个指向错误提交的 tag。
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest -q tests/test_version_gate.py

      - name: 校验 VERSION
        # 比对的是**基点上的** VERSION:单调性约束的是「改 VERSION 这个动作」。
        # 按「任何时刻都不低于最新 tag」判的话,main 发布新版那一刻所有开着的 PR
        # 会集体变红,而它们一个字都没改。
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          prev=""
          if git cat-file -e "$base:VERSION" 2>/dev/null; then
            prev="$(git show "$base:VERSION")"
          fi
          python3 scripts/version_gate.py check VERSION --previous "$prev"

  # ── 2. 自动 tag 与 Release ────────────────────────────────────────────────
  release:
    # workflow_run 在 CI 失败时同样会触发,故必须自己判 conclusion。
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 需要全部 tag 才能算出上一版和变更范围
          # 钉到触发本次发版的那轮 CI 所验证的提交。不钉的话取的是 checkout 时刻的
          # main —— CI 绿之后又合进来的提交会一起被打进 tag,而它们一行都没跑过测试。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 读 VERSION 定版本
        id: ver
        run: |
          set -euo pipefail
          # 发版时机由「改 VERSION 的那个 PR」决定,不由提交类型自动进位:一批功能被
          # 拆成十个版本号时,版本号就不再表达「这一版带来了什么」,而部署只认 Release。
          python3 scripts/version_gate.py decide VERSION | tee -a "$GITHUB_OUTPUT"

      - name: 生成 Release notes
        if: steps.ver.outputs.go == 'true'
        run: |
          set -euo pipefail
          {
            echo "## 本次变更"
            echo
            for pair in "feat:功能" "fix:修复" "refactor:重构" "perf:性能" "docs:文档" "ci:构建与流水线"; do
              t="${pair%%:*}"; label="${pair##*:}"
              body="$(git log ${{ steps.ver.outputs.range }} --pretty='- %s' \
                      | grep -E "^- $t(\([^)]*\))?!?:" || true)"
              [ -n "$body" ] && { echo "### $label"; echo; echo "$body"; echo; }
            done
            echo "---"
            echo
            echo "部署以本 Release 的 tag 为准（#334 第四节）。"
            [ -n "${{ steps.ver.outputs.prev }}" ] && \
              echo "对比：${{ steps.ver.outputs.prev }}...${{ steps.ver.outputs.next }}"
          } > notes.md
          cat notes.md

      - name: 打 tag 并发布
        if: steps.ver.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          # 幂等判据看 **Release** 而不是 tag:打 tag 与建 Release 是两次独立操作,tag 推成功
          # 之后建 Release 若因网络或 API 抖动失败,重跑时按 tag 判会永久跳过,仓库里留下一个
          # 没有 Release 的版本 tag —— 而部署只认 Release,那个版本就永远上不了线。
          if gh release view "$NEXT" >/dev/null 2>&1; then
            echo "Release $NEXT 已存在,跳过"; exit 0
          fi
          # tag 可能是上一次跑到一半留下的。已存在且指向同一个提交就沿用,指向别处则是
          # 真冲突,必须报错而不是悄悄挪走别人的 tag。
          # 附注 tag 要写进 tagger 身份,而 runner 的主机名是 `.(none)`,git 推不出邮箱,
          # 直接以 128 退出。身份必须显式给,不能指望自动探测。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$NEXT^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$NEXT 已指向别的提交,不覆盖"; exit 1
            fi
            echo "$NEXT 已存在且指向本次提交,补建 Release"
          else
            git tag -a "$NEXT" -m "$NEXT"
            git push origin "$NEXT"
          fi
          gh release create "$NEXT" --title "$NEXT" --notes-file notes.md

  # ── 3. CD ────────────────────────────────────────────────────────────────
  # 部署按 #653 单独处理:它需要 Environment Secrets 与 required reviewer,且本仓
  # 当前没有任何部署 workflow。接进来的形态是本文件再加一个 needs: release 的 job。
