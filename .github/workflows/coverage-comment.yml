name: Coverage Comment

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    # 只在 PR 触发的 workflow_run 且成功时运行
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage and comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // ── 1. 获取 PR number ──
            // workflow_run 事件自带 pull_requests 数组（含 fork PR）
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || !prs.length) {
              core.info('No pull_requests in workflow_run payload, skipping');
              return;
            }
            const prNumber = prs[0].number;

            // ── 2. 下载 coverage-xml artifact ──
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'coverage-xml');
            if (!artifact) {
              core.info('No coverage-xml artifact found, skipping comment');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('/tmp/coverage-xml.zip', Buffer.from(download.data));

            // ── 3. 解析覆盖率 ──
            execSync('unzip -o /tmp/coverage-xml.zip -d /tmp/coverage');
            const xml = fs.readFileSync('/tmp/coverage/coverage.xml', 'utf8');
            const lineRate = parseFloat(xml.match(/line-rate="([\d.]+)"/)?.[1] || '0');
            const branchRate = parseFloat(xml.match(/branch-rate="([\d.]+)"/)?.[1] || '0');
            const lineCov = (lineRate * 100).toFixed(2);
            const branchCov = (branchRate * 100).toFixed(2);

            // ── 4. 发表 / 更新 PR 评论 ──
            const body = [
              '## Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Line Coverage | ${lineCov}% |`,
              `| Branch Coverage | ${branchCov}% |`,
              '',
              `> HTML report available in [Artifacts](../actions/runs/${context.payload.workflow_run.id})`,
              '>',
              '> Refs: #167',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes('## Coverage Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created new comment on PR #${prNumber}`);
            }
