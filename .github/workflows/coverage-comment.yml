name: Coverage Comment

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    # 只在 PR 触发的 workflow_run 且成功时运行
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage XML
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'coverage-xml');
            if (!artifact) {
              core.info('No coverage-xml artifact found, skipping comment');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/coverage-xml.zip', Buffer.from(download.data));

      - name: Unzip and parse coverage
        id: coverage
        run: |
          unzip /tmp/coverage-xml.zip -d /tmp/coverage
          LINE=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' /tmp/coverage/coverage.xml | head -1)
          BRANCH=$(sed -n 's/.*branch-rate="\([0-9.]*\)".*/\1/p' /tmp/coverage/coverage.xml | head -1)
          echo "line=$(echo "$LINE * 100" | bc | xargs printf '%.2f')" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$BRANCH * 100" | bc | xargs printf '%.2f')" >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        env:
          LINE_COV: ${{ steps.coverage.outputs.line }}
          BRANCH_COV: ${{ steps.coverage.outputs.branch }}
        with:
          script: |
            // 找到关联的 PR number
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
            });
            if (!prs.data.length) {
              core.info('No open PR found for this branch, skipping comment');
              return;
            }
            const prNumber = prs.data[0].number;

            const lineCov = process.env.LINE_COV || '0';
            const branchCov = process.env.BRANCH_COV || '0';

            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Line Coverage | ${lineCov}% |`,
              `| Branch Coverage | ${branchCov}% |`,
              '',
              `> 📁 HTML report available in [Artifacts](../actions/runs/${context.payload.workflow_run.id})`,
              '>',
              '> Refs: #167',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes('## 📊 Coverage Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created new comment on PR #${prNumber}`);
            }
