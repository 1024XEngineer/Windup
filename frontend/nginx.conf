# ── 前端容器内的 nginx 配置 ──────────────────────────────────────────
# 只管容器内这一层:静态资源 + SPA 回退 + /api 反代。
# 宿主机若另有 nginx / 宝塔在管域名和证书,让它转发到本容器映射出去的端口即可,
# 这份配置不需要跟着改。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # ── 后端反代 ──
    # 后端路由挂在根路径(/projects、/characters、/users),所以要把 /api 前缀剥掉:
    # /api/projects → backend:8000/projects。改动前先确认后端没有自带路由前缀,
    # 否则会变成 /api/api/…。
    location /api/ {
        # 用变量 + Docker 内嵌 DNS 而不是直接写 proxy_pass http://backend:8000/,
        # 是为了让 nginx 每次请求重新解析:直写主机名时 nginx 只在启动时解析一次,
        # backend 容器一重建就换 IP,前端会一直 502 到手动 reload 为止;
        # 而且启动时解析不到还会直接起不来,后端没起前端连静态页都打不开。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $windup_backend backend;

        # rewrite + 不带 URI 的 proxy_pass:变量形式下 nginx 不会自动剥前缀,
        # 得自己改写(query string 由 rewrite 自动保留)。
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$windup_backend:8000;

        # 后端 /media/upload 接受图片且自身不限大小,而 nginx 默认只放行 1 MB,
        # 不放宽的话参考图稍大就会在这一层被 413,FastAPI 根本看不到请求。
        # 20m 是部署层兜底,后端定出上传上限后与之对齐。
        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成类接口一次要跑数分钟(后端对第三方的轮询上限是 30 分钟),
        # nginx 默认 60s 会在中途掐断连接,前端表现为任务莫名失败。
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 静态资源缓存 ──
    # Vite 产物带内容 hash,文件名变了才是新内容,可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 必须不缓存:它内嵌的是带 hash 的资源名,发版后浏览器若拿旧 html
    # 去要已被删掉的旧文件,页面直接白屏。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── SPA 回退 ──
    # 磁盘上没有 /projects 这种文件,不回退到 index.html 的话刷新子路由就是 404。
    # 对应 vercel.json 里那条把一切重写到 /index.html 的 rewrite。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
