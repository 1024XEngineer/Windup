[project]
name = "windup-app"
version = "0.1.0"
description = "windup 应用:server 领域 + web API + worker MQ 适配 + bootstrap 装配"
requires-python = ">=3.12"
dependencies = [
    "windup-common",
    "windup-framework",
    "windup-ai-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    # server/media/service.py 用它上传 Kodo。函数内延迟 import,不声明的话
    # 镜像照样能起来,直到第一次 POST /media/upload 才 ModuleNotFoundError。
    "qiniu>=7.13",
]

[project.scripts]
windup = "windup_app.bootstrap.app:main"

[tool.uv.sources]
windup-common = { workspace = true }
windup-framework = { workspace = true }
windup-ai-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windup_app"]
