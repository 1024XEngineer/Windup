[package]
name = "windup-pixel-grid-reconstructor"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.12.0"

[[bin]]
name = "windup-pixel-grid-reconstructor"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
