# ── Windup Docker Compose ─────────────────────────────────────────────
# 使用方式:
#   启动服务: docker compose up -d
#   查看日志: docker compose logs -f [service]
#   停止服务: docker compose down
#   清理数据: docker compose down -v  (⚠️ 会删除数据库数据)
#   重新构建: docker compose up -d --build

services:
  # ── Redis 缓存（验证码 / refresh_token） ──
  redis:
    image: redis:7-alpine
    container_name: windup-redis
    restart: unless-stopped
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - windup-net

  # ── PostgreSQL 数据库 ──
  postgres:
    image: postgres:16-alpine
    container_name: windup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-W1ndup@2026!Secure}
      POSTGRES_DB: ${POSTGRES_DB:-windup}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-7856}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-windup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - windup-net

  # ── 后端 API 服务 ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 由部署脚本传入:`WINDUP_BUILD_COMMIT=$(git rev-parse HEAD) docker compose build`
        WINDUP_BUILD_COMMIT: ${WINDUP_BUILD_COMMIT:-}
    container_name: windup-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器内部通信用 Docker 主机名，覆盖 .env 中的本地开发值
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${WINDUP_PORT:-8000}:8000"
    networks:
      - windup-net

  # ── Worker（MQ 消费：邮件 + 生成调度） ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 由部署脚本传入:`WINDUP_BUILD_COMMIT=$(git rev-parse HEAD) docker compose build`
        WINDUP_BUILD_COMMIT: ${WINDUP_BUILD_COMMIT:-}
    container_name: windup-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["python", "-m", "windup_app.worker"]
    healthcheck:
      disable: true
    networks:
      - windup-net

  # ── 前端静态产物构建任务 ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期烘进产物的后端地址，运行期改不动，所以放在 build.args 而非
        # environment。默认相对路径 → 与页面同源 → 不产生跨域，后端不必配来源白名单。
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: windup-frontend
    restart: "no"
    depends_on:
      - backend
    volumes:
      # 构建命令直接写入宿主机 nginx 的站点目录；容器退出后产物仍保留。
      - /var/www/react-windup:/var/www/react-windup
    networks:
      - windup-net

networks:
  windup-net:
    driver: bridge
    # 宿主机链路 MTU 是 1480（eno1），compose 自建网络不会继承 daemon 的 mtu 设置，
    # 默认仍是 1500 → 大包被丢，表现为 TLS 握手超时（七牛上传域名连不上、pip 下载卡死）。
    driver_opts:
      com.docker.network.driver.mtu: "1450"
